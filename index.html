<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>Storybook — Voice-First AI Children's Storybook Maker</title>
    <meta name="description" content="Narrate your adventures live, watch Gemini craft illustrated storybook pages, switch themes, and export a keepsake PDF." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/newsreader-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      html, body {
        background-color: #fbfaf7;
        color: #1b1a18;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #121211;
        color: #eceae4;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]), html:not([data-theme="light"]) body {
          background-color: #121211;
          color: #eceae4;
        }
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('storybook_theme') || localStorage.getItem('lp_theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center;">
        <h1 style="font-family: 'Newsreader', Georgia, serif; font-size: 2.25rem; font-weight: normal; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Storybook</h1>
        <p style="font-size: 1.05rem; opacity: 0.75; max-width: 32rem; margin: 0 auto;">Narrate your adventures with your voice, watch Gemini turn them into illustrated storybook pages, and export your keepsake PDF.</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
